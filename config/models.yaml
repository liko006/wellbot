# max_tokens = thinking + response
#
# thinking_always_on — 사고를 끄지 않는 모델 (기본값: false)
#   true  : '확장 사고' 토글이 켜진 채 잠기고, 토글과 무관하게 항상 사고한다
#   false : 토글 OFF 면 thinking 을 보내지 않는다 = 사고하지 않음 (Opus 4.7/4.8)

models:
  - name: "Claude Sonnet 5"
    description: "일상 작업에 가장 효율적인 최신 모델"
    provider: "bedrock"
    model_id: "global.anthropic.claude-sonnet-5"
    context_window: 1000000
    max_tokens: 32768
    temperature: 0.4
    supports_temperature: false
    thinking: true
    thinking_mode: "adaptive"
    thinking_always_on: true        # API 가 끄는 것을 지원하지 않는다
    effort: "medium"
    supports_vision: true
    supports_document: true

  - name: "Claude Opus 4.7"
    description: "심층 추론과 어려운 문제 해결"
    provider: "bedrock"
    model_id: "global.anthropic.claude-opus-4-7"
    context_window: 1000000
    max_tokens: 32768
    temperature: 0.4
    supports_temperature: false
    thinking: true
    thinking_mode: "adaptive"
    effort: "high"
    supports_vision: true
    supports_document: true

  - name: "Claude Opus 4.8"
    description: "복잡한 문서와 전문적인 분석 작업"
    provider: "bedrock"
    model_id: "global.anthropic.claude-opus-4-8"
    context_window: 1000000
    max_tokens: 32768
    temperature: 0.4
    supports_temperature: false
    thinking: true
    thinking_mode: "adaptive"
    effort: "high"
    supports_vision: true
    supports_document: true

  - name: "Claude Opus 5"
    description: "최고 성능의 최신 플래그십 모델"
    provider: "bedrock"
    model_id: "global.anthropic.claude-opus-5"
    context_window: 1000000
    max_tokens: 32768
    temperature: 0.4
    supports_temperature: false
    thinking: true
    thinking_mode: "adaptive"
    # 최상위 모델을 사고 없이 쓸 이유가 없어 항상 켠다(정책).
    # 깊이 조절이 필요하면 effort 를 낮춘다 — low 면 쉬운 질문에서 모델이 사고를 건너뛴다.
    thinking_always_on: true
    effort: "high"
    supports_vision: true
    supports_document: true

  - name: "Amazon Nova Pro"
    description: "균형 잡힌 성능과 비용"
    provider: "bedrock"
    model_id: "apac.amazon.nova-pro-v1:0"
    context_window: 300000
    max_tokens: 4096
    temperature: 0.6
    top_p: 0.9
    supports_vision: true
    supports_document: true

  - name: "Amazon Nova Lite"
    description: "가장 빠른 답변"
    provider: "bedrock"
    model_id: "apac.amazon.nova-lite-v1:0"
    context_window: 300000
    max_tokens: 2048
    temperature: 0.6
    top_p: 0.9
    supports_vision: true
    supports_document: true

# 대화 제목 생성 (경량 모델)
title:
  model_id: "apac.amazon.nova-lite-v1:0"
  max_tokens: 30
  temperature: 0.3
  system_prompt: |
    대화의 첫 질문과 응답을 보고, 이 대화를 대표하는 짧은 제목을 한국어로 만들어주세요.15자 이내로, 제목만 출력하세요. 따옴표나 부가 설명 없이 제목 텍스트만 응답하세요.

# 임베딩 모델
embedding:
  model_id: "amazon.titan-embed-text-v2:0"
  dimension: 1024
