# KnowledgeBase 설정
# 인프라 자원(S3 버킷, Lambda ARN, IAM Role ARN)은 .env 의 KB_* 변수에서 주입됨.
# 이 파일에는 KB 동작 옵션(임베딩 모델, 폴링 주기, 폴더 매핑 등)만 둠.

personal_kb:
  embedding_model: "amazon.titan-embed-text-v2:0"
  kb_poll_interval: 5              # KB 생성 상태 확인 주기 (초)
  kb_poll_timeout: 120             # KB 생성 대기 최대 시간 (초)
  ingest_poll_interval: 5          # Ingestion 상태 확인 주기 (초)
  ingest_poll_timeout: 600         # Ingestion 대기 최대 시간 (초)

shared_kb:
  kb_id: ""                        # 공용 Bedrock KB ID (환경변수 KB_ID로도 설정 가능)
  embedding_model: "amazon.titan-embed-text-v2:0"
  poll_interval: 5                 # Ingestion 상태 확인 주기 (초)
  poll_timeout: 1800               # Ingestion 대기 최대 시간 (초) — 공용 KB는 대용량 가정
  # 권위 재랭킹(Task 3): 문서별 속성으로 정렬 우대 + 담당부서 노출. 비우면 재랭킹 안 함(현행 동일).
  # 폴더는 도메인(표시용)일 뿐 권위와 무관 — 순위·부서가 도메인을 가로지르므로 문서 단위로 관리.
  # (1) 티어 사다리: 티어 번호(0=최우선) → 정렬 배수. 단조감소. floor 는 constants.KB_AUTHORITY_FLOOR.
  authority_tiers:
    0: 1.5
    1: 1.35
    2: 1.2
    3: 1.1
  # (2) 문서별 속성(문서-major): "도메인/[서브/]파일명" → {tier, dept, ...}. raw/originals 마커는 키에 안 씀.
  #     한 문서=한 entry(속성 추가 시 그 줄에 키만 추가). tier=권위 티어(사다리 참조),
  #     dept=담당 부서(컨텍스트 (담당:X) 노출→규정 답변서 그 부서 안내). 미지정 속성은 중립(tier 1.0/부서 미표시).
  #
  # ⚠ 아래 docs 와 맨 아래 folders 는 **씨앗(초기값)** 이다. 앱은 이 파일을 고치지 않고
  #   config/kb_registry.yaml(gitignore)에 쓴다 — 런타임에 바뀌는 값을 git 이 추적하는
  #   파일에 쓰면 배포 때 pull 이 막히고, 되돌리다 폴더 등록·티어가 유실된다.
  #   레지스트리 파일이 있으면 그 값이 이 씨앗을 **대체**한다(없으면 씨앗이 그대로 쓰임).
  #   레지스트리는 첫 쓰기 때 이 씨앗을 복사해 생성된다. 커밋용 스냅샷을 갱신하려면
  #   서버의 kb_registry.yaml 내용을 이 두 섹션에 반영해 커밋하면 된다.
